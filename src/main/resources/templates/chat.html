<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Room</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #74ebd5, #acb6e5);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .chat-container {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      height: 80vh;
      position: relative;
    }
    .chat-header {
      background: #007bff;
      color: #ffffff;
      padding: 15px;
      font-size: 1.5rem;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }
    .chat-box div {
      padding: 10px 15px;
      margin-bottom: 10px;
      border-radius: 20px;
      background: #e9ecef;
      align-self: flex-start;
      animation: fadeIn 0.5s ease-in-out;
    }
    .chat-box .sent {
      background: #007bff;
      color: #ffffff;
      align-self: flex-end;
    }
    .chat-input {
      display: flex;
      gap: 8px;
      padding: 15px;
      background: #f1f1f1;
      border-top: 1px solid #ccc;
    }
    .chat-input input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 20px;
    }
    .chat-input button {
      background: #007bff;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      transition: background 0.2s ease;
    }
    .chat-input button:hover {
      background: #0056b3;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <span>Chat Room</span>
      <button id="logoutBtn" class="btn btn-danger btn-sm">Logout</button>
    </div>
    <div id="chat" class="chat-box"></div>
    <div class="chat-input">
      <input type="text" id="senderInput" placeholder="Your name...">
      <input type="text" id="messageInput" placeholder="Type a message...">
      <button id="sendMessage">Send</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
  <script>
    let stompClient = null;

    function setConnected(connected) {
      document.getElementById('sendMessage').disabled = !connected;
    }

    function connect() {
      const socket = new SockJS('/chat');
      stompClient = Stomp.over(socket);
      stompClient.connect({}, function(frame) {
        setConnected(true);
        stompClient.subscribe('/topic/messages', function(message) {
          showMessage(JSON.parse(message.body));
        });
      });
    }

    function showMessage(message) {
      const chat = document.getElementById('chat');
      const messageElement = document.createElement('div');
      messageElement.textContent = `${message.sender}: ${message.content}`;
      messageElement.classList.add('sent');
      chat.appendChild(messageElement);
      chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
      const sender = document.getElementById('senderInput').value;
      const content = document.getElementById('messageInput').value;
      if (sender && content) {
        const chatmod = { sender, content };
        stompClient.send("/app/sendMessage", {}, JSON.stringify(chatmod));
        document.getElementById('messageInput').value = '';
      }
    }

    document.getElementById('sendMessage').onclick = sendMessage;

    // Retrieve stored username on page load and establish WebSocket connection
    window.onload = function() {
      const storedUsername = localStorage.getItem('loggedInUser');
      if (storedUsername) {
        document.getElementById('senderInput').value = storedUsername;
      }
      connect();
    };

    // Logout functionality: clear localStorage and redirect to login page
    document.getElementById('logoutBtn').onclick = function() {
      localStorage.removeItem('loggedInUser');
      window.location.href = '/login';
    };
  </script>
</body>
</html>
